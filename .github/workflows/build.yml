name: build
run-name: build xcaddy (${{ github.event_name }})

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: Rebuild even if neither Caddy nor the build inputs changed
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - config/**
      - scripts/**
      - packaging/**
      - apt/**
      - .github/workflows/build.yml

permissions: {}

# One release at a time; a running publish is never cancelled.
concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  PUBLIC_URL: https://gill-bates.github.io/xcaddy

jobs:
  check-version:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      reason: ${{ steps.decide.outputs.reason }}
      caddy_version: ${{ steps.decide.outputs.caddy_version }}
      revision: ${{ steps.decide.outputs.revision }}
      recover: ${{ steps.decide.outputs.recover }}
      package_version: ${{ steps.decide.outputs.package_version }}
      inputs_hash: ${{ steps.hash.outputs.inputs_hash }}
    steps:
      - name: Releases run on the default branch only
        env:
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "$DEFAULT_REF" ]; then
            echo "::error::build.yml publishes releases and runs on the default branch only (got $GITHUB_REF); use ci.yml (workflow_dispatch) for development branches" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-state
        with:
          token: ${{ github.token }}
          install-reprepro: "false"
      - name: Verify the staged state (apt-repo; a newer unconfirmed stage is recovered, never overwritten)
        env:
          KEY_ID: ${{ vars.APT_GPG_KEY_ID }}
        run: |
          if [ -f repo-state/release-manifest.json ]; then
            [ -n "$KEY_ID" ] || { echo "ERROR: repository variable APT_GPG_KEY_ID is required" >&2; exit 1; }
            python3 scripts/publish.py verify-state repo-state --fingerprint "$KEY_ID"
          else
            echo "no staged release yet (first release)"
          fi
      - name: Fetch and verify the public state (the version comparison runs against it)
        env:
          KEY_ID: ${{ vars.APT_GPG_KEY_ID }}
        run: python3 scripts/publish.py fetch-public "$PUBLIC_URL" --out published --fingerprint "$KEY_ID"
      - name: Plugin lock matches the plugin list
        run: python3 scripts/lock.py check
      - name: Latest stable Caddy version
        id: latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "version=$(python3 scripts/check_version.py latest | tail -n 1)" >> "$GITHUB_OUTPUT"
      - name: Build input hash
        id: hash
        run: echo "inputs_hash=$(python3 scripts/check_version.py inputs-hash | tail -n 1)" >> "$GITHUB_OUTPUT"
      - name: Decide
        id: decide
        env:
          LATEST: ${{ steps.latest.outputs.version }}
          INPUTS_HASH: ${{ steps.hash.outputs.inputs_hash }}
          FORCE: ${{ inputs.force_build && 'true' || 'false' }}
        run: |
          python3 scripts/check_version.py decide --latest "$LATEST" --state published/release-manifest.json --status published/release-status.json \
            --staged repo-state/release-manifest.json --inputs-hash "$INPUTS_HASH" --force "$FORCE"

  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load toolchain versions
        run: python3 scripts/toolchain.py >> "$GITHUB_ENV"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install xcaddy
        run: go install "github.com/caddyserver/xcaddy/cmd/xcaddy@${XCADDY_VERSION}"
      - name: Build and verify Caddy
        env:
          CADDY_VERSION: ${{ needs.check-version.outputs.caddy_version }}
          ARCH: ${{ matrix.arch }}
        run: python3 scripts/build.py --caddy-version "$CADDY_VERSION" --arch "$ARCH" --out build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.arch }}
          path: build/
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [check-version, build]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    # The attested package is built here and the built binary never runs in this job.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ matrix.arch }}
          path: build
      - name: Package
        env:
          PKG_VERSION: ${{ needs.check-version.outputs.package_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/package.py build --version "$PKG_VERSION" --arch "$ARCH" \
            --binary build/caddy --manifest build/build-manifest.json --out dist
      - name: Checksums
        env:
          ARCH: ${{ matrix.arch }}
        run: cd dist && sha256sum ./*.deb > "SHA256SUMS-${ARCH}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  install-test:
    needs: [check-version, build, package]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    # Runs the freshly built binary as root, so the job has no token scopes beyond reading.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ matrix.arch }}
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: dist
      - name: Baseline package
        env:
          CADDY_VERSION: ${{ needs.check-version.outputs.caddy_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          chmod +x build/caddy
          # Revision 0 sorts below every real release and serves as the upgrade-test baseline.
          python3 scripts/package.py build --version "${CADDY_VERSION}+xcaddy.0" --arch "$ARCH" \
            --binary build/caddy --manifest build/build-manifest.json --out baseline
      - name: Install, upgrade, no-op, remove and purge via a signed local repository
        env:
          PKG_VERSION: ${{ needs.check-version.outputs.package_version }}
          CADDY_VERSION: ${{ needs.check-version.outputs.caddy_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro
          sudo env "PATH=$PATH" python3 scripts/test.py apt \
            --old-deb "baseline/xcaddy_${CADDY_VERSION}+xcaddy.0_${ARCH}.deb" \
            --new-deb "dist/xcaddy_${PKG_VERSION}_${ARCH}.deb" \
            --allow-host-changes --check-binary

  trivy-scan:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load toolchain versions
        run: python3 scripts/toolchain.py >> "$GITHUB_ENV"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: dist
      - name: Scan package, binary and build configuration
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir reports
          python3 scripts/trivy_gate.py scan-deb dist/*.deb --report "reports/trivy-${ARCH}-package.json"
          python3 scripts/trivy_gate.py scan-config --report "reports/trivy-${ARCH}-config.json"
      - name: Gate (CRITICAL and HIGH block)
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/trivy_gate.py evaluate "reports/trivy-${ARCH}-package.json" \
            "reports/trivy-${ARCH}-config.json" --summary "reports/summary-${ARCH}.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-${{ matrix.arch }}
          path: reports/
          retention-days: 30

  prepare-apt-repository:
    needs: [check-version, package, install-test, trivy-scan]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deb-*
          path: bundle
          merge-multiple: true
      - name: Verify both architectures and checksums
        env:
          PKG_VERSION: ${{ needs.check-version.outputs.package_version }}
        run: |
          for arch in amd64 arm64; do
            python3 scripts/package.py validate "bundle/xcaddy_${PKG_VERSION}_${arch}.deb" \
              --version "$PKG_VERSION" --arch "$arch" > /dev/null
          done
          for arch in amd64 arm64; do
            (cd bundle && sha256sum -c "SHA256SUMS-${arch}")
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: bundle/
          if-no-files-found: error
          retention-days: 7

  sign-and-publish:
    needs: [check-version, prepare-apt-repository]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: apt-publish
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: bundle
      - uses: ./.github/actions/restore-state
        with:
          token: ${{ github.token }}
      - name: Recheck the state under the release lock
        env:
          LATEST: ${{ needs.check-version.outputs.caddy_version }}
          INPUTS_HASH: ${{ needs.check-version.outputs.inputs_hash }}
          EXPECTED: ${{ needs.check-version.outputs.package_version }}
          FORCE_BUILD: ${{ inputs.force_build && 'true' || 'false' }}
          KEY_ID: ${{ vars.APT_GPG_KEY_ID }}
        run: |
          [ ! -f repo-state/release-manifest.json ] || python3 scripts/publish.py verify-state repo-state --fingerprint "$KEY_ID"
          python3 scripts/publish.py check-ancestry --repo-dir repo-state --commit "$GITHUB_SHA"
          python3 scripts/publish.py fetch-public "$PUBLIC_URL" --out published --fingerprint "$KEY_ID"
          python3 scripts/check_version.py decide --latest "$LATEST" --inputs-hash "$INPUTS_HASH" \
            --state published/release-manifest.json --status published/release-status.json \
            --staged repo-state/release-manifest.json \
            --expect-package-version "$EXPECTED" --force "$FORCE_BUILD"
      - name: Import the signing key (temporary keyring)
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          APT_GPG_KEY_ID: ${{ vars.APT_GPG_KEY_ID }}
        run: |
          echo "GNUPGHOME=$RUNNER_TEMP/gnupg" >> "$GITHUB_ENV"
          GNUPGHOME="$RUNNER_TEMP/gnupg" python3 scripts/publish.py import-key | tee fingerprint.txt
      - name: Add packages, sign and export
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          CADDY_VERSION: ${{ needs.check-version.outputs.caddy_version }}
          REVISION: ${{ needs.check-version.outputs.revision }}
          INPUTS_HASH: ${{ needs.check-version.outputs.inputs_hash }}
        run: |
          fpr=$(sed -n 's/^fingerprint=//p' fingerprint.txt | tail -n 1)
          python3 scripts/publish.py init --repo-dir repo-state --fingerprint "$fpr"
          python3 scripts/publish.py add --repo-dir repo-state bundle/*.deb | tee add.txt
          if grep -q '^added=true' add.txt; then
            python3 scripts/publish.py finalize --repo-dir repo-state --fingerprint "$fpr" \
              --caddy-version "$CADDY_VERSION" --revision "$REVISION" --inputs-hash "$INPUTS_HASH" \
              --debs bundle/*.deb
          fi
          python3 scripts/publish.py export-site --repo-dir repo-state --out site
          python3 scripts/publish.py verify-site site --fingerprint "$fpr"
          python3 scripts/publish.py cleanup
      - id: release
        run: python3 scripts/publish.py release-id --repo-dir repo-state
      - uses: ./.github/actions/persist-state
        with:
          token: ${{ github.token }}
          message: Publish xcaddy ${{ needs.check-version.outputs.package_version }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: pages-publish
          path: site
      - name: Remove the temporary keyring
        if: always()
        run: python3 scripts/publish.py cleanup

  recover-stage:
    needs: check-version
    if: needs.check-version.outputs.recover == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-state
        with:
          token: ${{ github.token }}
      - name: Re-stage the staged snapshot (signer pinned, version bound to the decision)
        env:
          KEY_ID: ${{ vars.APT_GPG_KEY_ID }}
          EXPECTED: ${{ needs.check-version.outputs.package_version }}
        run: |
          [ -n "$EXPECTED" ] || { echo "ERROR: no expected package version" >&2; exit 1; }
          python3 scripts/publish.py verify-state repo-state --fingerprint "$KEY_ID" --expect-package-version "$EXPECTED"
          python3 scripts/publish.py export-site --repo-dir repo-state --out site
          python3 scripts/publish.py release-id --repo-dir repo-state | tee release.txt
          release_id=$(sed -n 's/^release_id=//p' release.txt | tail -n 1)
          python3 scripts/publish.py verify-site site --fingerprint "$KEY_ID" --expect-release-id "$release_id"
      - id: release
        run: python3 scripts/publish.py release-id --repo-dir repo-state
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: pages-recover
          path: site

  deploy-pages:
    needs: [sign-and-publish, recover-stage]
    if: always() && (needs.sign-and-publish.result == 'success' || needs.recover-stage.result == 'success')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.sign-and-publish.result == 'success' && 'pages-publish' || 'pages-recover' }}

  verify-publication:
    needs: [check-version, sign-and-publish, recover-stage, deploy-pages]
    if: ${{ !cancelled() && needs.deploy-pages.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Signatures, by-hash and metadata on the public URL
        env:
          KEY_ID: ${{ vars.APT_GPG_KEY_ID }}
          RELEASE_ID: ${{ needs.sign-and-publish.outputs.release_id || needs.recover-stage.outputs.release_id }}
        run: |
          [ -n "$RELEASE_ID" ] || { echo "ERROR: no release id from the publishing job" >&2; exit 1; }
          python3 scripts/publish.py verify-url "$PUBLIC_URL" --fingerprint "$KEY_ID" --expect-release-id "$RELEASE_ID"
      - name: apt update against the public URL
        env:
          PKG_VERSION: ${{ needs.check-version.outputs.package_version }}
        run: |
          d="$RUNNER_TEMP/apt-verify"
          mkdir -p "$d/lists/partial" "$d/cache/archives/partial"
          curl -fsS "$PUBLIC_URL/gpg.key" -o "$d/xcaddy.asc"
          echo "deb [signed-by=$d/xcaddy.asc] $PUBLIC_URL stable main" > "$d/sources.list"
          opts=(-o "Dir::Etc::sourcelist=$d/sources.list" -o Dir::Etc::sourceparts=/dev/null
                -o "Dir::State::lists=$d/lists" -o "Dir::Cache=$d/cache" -o APT::Sandbox::User=root)
          sudo apt-get "${opts[@]}" update
          apt-cache "${opts[@]}" policy xcaddy | tee policy.txt
          grep -Fx "  Candidate: ${PKG_VERSION}" policy.txt

  confirm-published:
    needs: [check-version, sign-and-publish, recover-stage, verify-publication]
    if: ${{ !cancelled() && needs.verify-publication.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: apt-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-state
        with:
          token: ${{ github.token }}
      - name: Import the signing key (temporary keyring)
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          APT_GPG_KEY_ID: ${{ vars.APT_GPG_KEY_ID }}
        run: |
          echo "GNUPGHOME=$RUNNER_TEMP/gnupg" >> "$GITHUB_ENV"
          GNUPGHOME="$RUNNER_TEMP/gnupg" python3 scripts/publish.py import-key | tee fingerprint.txt
      - name: Record VERIFIED and PUBLISHED (the manifest itself is not re-signed)
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          RELEASE_ID: ${{ needs.sign-and-publish.outputs.release_id || needs.recover-stage.outputs.release_id }}
        run: |
          [ -n "$RELEASE_ID" ] || { echo "ERROR: no release id from the publishing job" >&2; exit 1; }
          fpr=$(sed -n 's/^fingerprint=//p' fingerprint.txt | tail -n 1)
          python3 scripts/publish.py verify-state repo-state --fingerprint "$fpr" --expect-release-id "$RELEASE_ID"
          python3 scripts/publish.py set-status --repo-dir repo-state --fingerprint "$fpr" --status VERIFIED
          python3 scripts/publish.py set-status --repo-dir repo-state --fingerprint "$fpr" --status PUBLISHED
          python3 scripts/publish.py export-site --repo-dir repo-state --out site
          python3 scripts/publish.py verify-site site --fingerprint "$fpr" --expect-release-id "$RELEASE_ID"
          python3 scripts/publish.py cleanup
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: pages-confirm
          path: site
      - uses: ./.github/actions/persist-state
        with:
          token: ${{ github.token }}
          message: Mark ${{ needs.check-version.outputs.package_version }} as PUBLISHED
      - name: Remove the temporary keyring
        if: always()
        run: python3 scripts/publish.py cleanup

  deploy-status:
    needs: confirm-published
    if: ${{ !cancelled() && needs.confirm-published.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: pages-confirm

  verify-status:
    needs: [check-version, sign-and-publish, recover-stage, deploy-status]
    if: ${{ !cancelled() && needs.deploy-status.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The public URL serves the signed status PUBLISHED for this release
        env:
          KEY_ID: ${{ vars.APT_GPG_KEY_ID }}
          RELEASE_ID: ${{ needs.sign-and-publish.outputs.release_id || needs.recover-stage.outputs.release_id }}
        run: |
          for delay in 5 10 20 30 0; do
            rm -rf "$RUNNER_TEMP/public" && mkdir -p "$RUNNER_TEMP/public"
            if python3 scripts/publish.py fetch-public "$PUBLIC_URL" --out "$RUNNER_TEMP/public" --fingerprint "$KEY_ID" \
              && jq -e --arg id "$RELEASE_ID" '.release_id == $id and .status == "PUBLISHED"' "$RUNNER_TEMP/public/release-status.json"; then
              exit 0
            fi
            [ "$delay" -eq 0 ] && break
            echo "status not yet verifiable, retrying in ${delay}s" >&2
            sleep "$delay"
          done
          echo "ERROR: the public URL does not serve the signed PUBLISHED status for $RELEASE_ID" >&2
          exit 1

  summary:
    needs: [check-version, build, package, install-test, trivy-scan, sign-and-publish, deploy-pages, verify-publication, confirm-published, deploy-status, verify-status]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Outcome
        env:
          SHOULD_BUILD: ${{ needs.check-version.outputs.should_build }}
          RECOVER: ${{ needs.check-version.outputs.recover }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          DEPLOY_STATUS: ${{ needs.deploy-status.result }}
          VERIFY_STATUS: ${{ needs.verify-status.result }}
        run: |
          if [[ " $RESULTS " == *" failure "* || " $RESULTS " == *" cancelled "* ]]; then
            echo "### Failed: the public state may already be DEPLOYED but is not confirmed as PUBLISHED; the next run recovers" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [[ "$SHOULD_BUILD" == "false" && "$RECOVER" != "true" ]]; then
            echo "### No new version: nothing to build" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$DEPLOY_STATUS" != "success" || "$VERIFY_STATUS" != "success" ]]; then
            echo "### Failed: a release was required but the PUBLISHED status was not deployed and verified" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "### Succeeded: release published and confirmed" >> "$GITHUB_STEP_SUMMARY"
          fi
